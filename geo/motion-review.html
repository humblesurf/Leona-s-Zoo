<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>动物动作 · V4.6 / V4.6.1 对照</title>
<style>*{box-sizing:border-box}body{margin:0;color:#3d4939;background:#f6efdf;font:15px system-ui,"Microsoft YaHei",sans-serif}header{min-height:68px;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}select,button{border:1px solid #cecdb9;border-radius:10px;background:#fffdf6;color:inherit;padding:8px 12px;font:inherit}button{cursor:pointer}a{margin-left:auto;color:#416b45;text-decoration:none}.stage{display:grid;grid-template-columns:1fr 1fr;height:calc(100dvh - 68px)}.pane{min-width:0;display:flex;flex-direction:column}.label{height:32px;background:#e8e4d5;padding:6px 15px;font-size:13px}.candidate .label{background:#dcebd4}iframe{width:100%;flex:1;min-height:0;border:0}body[data-view="new"] .baseline,body[data-view="old"] .candidate{display:none}body[data-view="new"] .stage,body[data-view="old"] .stage{grid-template-columns:1fr}.status{font-size:12px;color:#667261}@media(max-width:900px){header{height:108px;padding:8px;gap:7px}.stage{height:calc(100dvh - 108px)}.status{display:none}}</style></head>
<body data-view="both"><header><strong>动作对照</strong><select id="animal" aria-label="选择动物"></select><select id="speed" aria-label="播放速度"><option value="1">正常速度</option><option value=".5">半速</option></select><select id="view" aria-label="显示版本"><option value="both">左右对照</option><option value="new">只看 V4.6.1</option><option value="old">只看 V4.6</option></select><button id="replay" disabled>再播放一次</button><span id="status" class="status">正在准备</span><a href="./?v=4.6.1">进入游戏 →</a></header>
<div class="stage"><section class="pane baseline"><div class="label">V4.6 · 保留的上一版</div><iframe id="old" src="../share/runtime-v4-6/index.html" title="V4.6 原有动作"></iframe></section><section class="pane candidate"><div class="label">V4.6.1 · 猎豹前脚交替</div><iframe id="new" src="./?v=4.6.1" title="V4.6.1 新动作"></iframe></section></div>
<script>
const names={cheetah:'猎豹 · 前脚交替快跑',tiger:'老虎 · 小跑',giraffe:'长颈鹿 · 伸颈吃叶',elephant:'大象 · 稳步与抬鼻',elephantcalf:'小象 · 扇耳问好',zebra:'斑马 · 轻快小跑',buffalo:'水牛 · 迈步与低头',warthog:'疣猪 · 快步嗅探',rhino:'犀牛 · 稳步张望',lioness:'母狮 · 轻快小跑',jaguar:'美洲豹 · 低姿态小跑',polarbear:'北极熊 · 稳步闻一闻',arcticfox:'北极狐 · 小跑摆尾',cow:'奶牛 · 迈步与咀嚼',sheep:'绵羊 · 迈步与低头',pig:'小猪 · 快步嗅探',calf:'小牛 · 轻快小跑',lamb:'小羊 · 轻快小跑',piglet:'猪宝宝 · 碎步小跑',lioncub:'狮子幼崽 · 小跑张望'};
const animal=document.querySelector('#animal'),speed=document.querySelector('#speed'),view=document.querySelector('#view'),replay=document.querySelector('#replay'),status=document.querySelector('#status'),frames=[document.querySelector('#old'),document.querySelector('#new')];
for(const [value,label]of Object.entries(names)){const o=document.createElement('option');o.value=value;o.textContent=label;animal.append(o);}
if(innerWidth<900){document.body.dataset.view='new';view.value='new';}
let serial=0,raf=0,ready=0;
async function play(){if(ready<2)return;const token=++serial;cancelAnimationFrame(raf);const entries=[];
 for(const frame of frames){const g=frame.contentWindow;g.AnimalAnims.stopAll();g.__Animals.stopSpeech();g.__Animals.dismissIntro();const el=[...g.document.querySelectorAll(`.animal[data-id="${animal.value}"]`)].find(e=>e.tabIndex===0);if(!el)continue;await el.querySelector('img').decode();if(token!==serial)return;const box=el.getBoundingClientRect();g.__Animals.camera+=box.left+box.width/2-g.innerWidth*.57;const r=g.AnimalAnims.play(el,animal.value);g.AnimalAnims.seek(el,0);entries.push({g,el,duration:r.duration/Number(speed.value)});}
 await new Promise(requestAnimationFrame);for(const {g,el}of entries)g.AnimalAnims.seek(el,0);const start=performance.now();
 status.textContent=animal.value==='cheetah'?'前脚交替 · 对角配合 · 快速小跑':animal.value==='tiger'?'对角腿交替 · 轻快小跑':animal.value==='giraffe'?'伸颈 → 够叶 → 咀嚼 → 收回':'查看落脚与身体节奏';
 function tick(t){if(token!==serial)return;let running=false;for(const e of entries){const p=Math.min(1,(t-start)/e.duration);if(e.g.AnimalAnims.isActing(e.el)){e.g.AnimalAnims.seek(e.el,p);if(p===1)e.g.AnimalAnims.stop(e.el);}running=running||p<1;}if(running)raf=requestAnimationFrame(tick);}raf=requestAnimationFrame(tick);
}
for(const frame of frames)frame.addEventListener('load',()=>{if(++ready===2){replay.disabled=false;play();}});
animal.addEventListener('change',play);speed.addEventListener('change',play);replay.addEventListener('click',play);view.addEventListener('change',()=>{document.body.dataset.view=view.value;setTimeout(play,150);});
</script></body></html>
