<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leona's ZOO · 原画动作预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6efdf;color:#3e513e;font:14px system-ui,"Microsoft YaHei",sans-serif}header{min-height:66px;display:flex;align-items:center;gap:9px;padding:10px 14px;flex-wrap:wrap}strong{font-size:17px}button,select{border:1px solid #cad0bd;border-radius:10px;padding:8px 11px;color:inherit;background:#fffdf7;font:inherit}button{cursor:pointer}a{margin-left:auto;color:#416b45;text-decoration:none;white-space:nowrap}.stage{height:calc(100dvh - 66px);display:grid;grid-template-columns:1fr}.pane{min-width:0;display:flex;flex-direction:column}iframe{width:100%;border:0;flex:1;min-height:0}.label{height:28px;font-size:12px;background:#e2eddb;padding:5px 13px}.old{position:fixed;left:-12000px;top:70px;width:50vw;height:calc(100dvh - 100px);visibility:hidden;pointer-events:none}.status{font-size:12px;color:#6d795f}body[data-compare="true"] .stage{grid-template-columns:1fr 1fr}body[data-compare="true"] .old{position:static;left:auto;top:auto;width:auto;height:auto;visibility:visible;pointer-events:auto}.old .label{background:#e8e4d5}@media(max-width:1000px){header{min-height:105px;padding:8px;gap:7px}.stage{height:calc(100dvh - 105px)}strong{font-size:15px}.status{display:none}}@media(max-height:500px) and (orientation:landscape){header{min-height:82px}.stage{height:calc(100dvh - 82px)}}
</style></head><body data-compare="false">
<header><strong>原画动作预览</strong><select id="animal" aria-label="选择动物"></select><select id="speed" aria-label="播放速度"><option value="1">正常速度</option><option value=".5">半速复查</option></select><button id="replay" disabled>再看一次</button><button id="compare" aria-pressed="false">对比上一版</button><span class="status" id="status">正在准备</span><a href="../share/runtime-v4-7/index.html">进入游戏 →</a></header>
<div class="stage"><section class="pane old"><div class="label">V4.6.1 · 保留的上一版</div><iframe id="old" src="../share/runtime-v4-6-1/index.html" title="上一版动物动作"></iframe></section><section class="pane"><div class="label">V4.7 · 完整原画，按动作拍点播放</div><iframe id="candidate" src="../share/runtime-v4-7/index.html" title="新原画动物动作"></iframe></section></div>
<script>
'use strict';
const names={cheetah:'猎豹 · 短跑',tiger:'老虎 · 有力短跑',jaguar:'美洲豹 · 低身短跑',zebra:'斑马 · 轻快迈步',elephant:'大象 · 稳步行走',elephantcalf:'小象 · 轻快迈步',warthog:'疣猪 · 快步前行',buffalo:'水牛 · 四拍稳步',rhino:'犀牛 · 沉稳迈步',lioness:'母狮 · 从容跨步',lioncub:'幼狮 · 轻快小跑',polarbear:'北极熊 · 稳步行走',arcticfox:'北极狐 · 轻快小跑',cow:'奶牛 · 平稳迈步',sheep:'绵羊 · 轻轻迈步',pig:'小猪 · 短步小跑',calf:'小牛 · 轻快抬蹄',lamb:'小羊 · 轻快小跑',piglet:'猪宝宝 · 短步小跑'};
const animal=document.querySelector('#animal'),speed=document.querySelector('#speed'),replay=document.querySelector('#replay'),compare=document.querySelector('#compare'),status=document.querySelector('#status'),frames=[document.querySelector('#old'),document.querySelector('#candidate')];
for(const[value,label]of Object.entries(names)){const o=document.createElement('option');o.value=value;o.textContent=label;animal.append(o);}
let ready=0,serial=0,raf=0;
async function play(){
 if(ready<2)return;const token=++serial;cancelAnimationFrame(raf);const entries=[];
 for(const frame of frames){const g=frame.contentWindow;g.AnimalAnims.stopAll();g.__Animals.stopSpeech();g.__Animals.dismissIntro();if(frame.id==='old'&&document.body.dataset.compare!=='true')continue;let el=[...g.document.querySelectorAll(`.animal[data-id="${animal.value}"]`)].find(e=>e.tabIndex===0);if(!el)continue;await el.querySelector('img').decode();await g.AnimalAnims.preload(animal.value);if(token!==serial)return;const box=el.getBoundingClientRect();g.__Animals.camera+=box.left+box.width/2-g.innerWidth*.58;el=[...g.document.querySelectorAll(`.animal[data-id="${animal.value}"]`)].sort((a,b)=>{const x=a.getBoundingClientRect(),y=b.getBoundingClientRect();return Math.abs(x.left+x.width/2-g.innerWidth*.58)-Math.abs(y.left+y.width/2-g.innerWidth*.58);})[0];await el.querySelector("img").decode();const r=g.AnimalAnims.play(el,animal.value);if(!r)continue;g.AnimalAnims.seek(el,0);entries.push({g,el,duration:r.duration/Number(speed.value),done:false});}
 await new Promise(requestAnimationFrame);if(token!==serial)return;for(const e of entries)e.g.AnimalAnims.seek(e.el,0);const start=performance.now();
 status.textContent='准备 → 前进 → 落稳';
 function tick(now){if(token!==serial)return;let running=false;for(const e of entries){if(e.done)continue;const p=Math.min(1,(now-start)/e.duration);if(e.g.AnimalAnims.isActing(e.el)){e.g.AnimalAnims.seek(e.el,p);if(p===1)e.g.AnimalAnims.stop(e.el);}if(p===1)e.done=true;running=running||p<1;}if(running)raf=requestAnimationFrame(tick);else status.textContent='动作结束 · 点击再看一次';}raf=requestAnimationFrame(tick);
}
for(const frame of frames)frame.addEventListener('load',()=>{if(++ready===2){replay.disabled=false;play();}});
animal.addEventListener('change',play);speed.addEventListener('change',play);replay.addEventListener('click',play);compare.addEventListener('click',()=>{const show=document.body.dataset.compare!=='true';document.body.dataset.compare=String(show);compare.setAttribute('aria-pressed',String(show));compare.textContent=show?'只看新动作':'对比上一版';setTimeout(play,120);});
</script></body></html>
