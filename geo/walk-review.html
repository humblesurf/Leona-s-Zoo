<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四足行走 · 动作复查</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5eedf;color:#3e4434;font:16px system-ui,"Microsoft YaHei",sans-serif}header{height:64px;display:flex;align-items:center;gap:12px;padding:10px 18px;flex-wrap:wrap}select,button{font:inherit;border:1px solid #d1cfbe;border-radius:10px;padding:7px 13px;background:#fffdf6;color:inherit}button{cursor:pointer}header a{margin-left:auto;color:#456841;text-decoration:none}iframe{display:block;border:0;width:100vw;height:calc(100dvh - 64px)}.note{font-size:13px;color:#6f7468}@media(max-width:780px){header{height:96px;padding:8px 12px;gap:8px}iframe{height:calc(100dvh - 96px)}.note{display:none}}
</style></head><body><header><strong>四足行走复查</strong><select id="animal" aria-label="选择动物"></select><select id="speed" aria-label="播放速度"><option value="1">正常速度</option><option value="0.5">半速检查</option></select><button id="replay" disabled>重新走一遍</button><span class="note">查看迈步、落地和收腿</span><a href="./?v=4.4">返回游戏 →</a></header><iframe id="game" src="./?v=4.4" title="动物游戏中的行走动作"></iframe><script>
const names={zebra:'斑马',buffalo:'水牛',warthog:'疣猪',rhino:'犀牛',elephant:'大象',elephantcalf:'小象',lioness:'母狮',tiger:'老虎',jaguar:'美洲豹',cheetah:'猎豹',polarbear:'北极熊',arcticfox:'北极狐',cow:'奶牛',sheep:'绵羊',pig:'小猪',calf:'小牛',lamb:'小羊',piglet:'猪宝宝',lioncub:'狮子幼崽'};
const frame=document.querySelector('#game'),select=document.querySelector('#animal'),speed=document.querySelector('#speed'),replay=document.querySelector('#replay');let raf=0,serial=0;
for(const [id,label]of Object.entries(names)){const o=document.createElement('option');o.value=id;o.textContent=label;select.append(o);}
async function play(){const token=++serial;cancelAnimationFrame(raf);const g=frame.contentWindow;g.AnimalAnims.stopAll();g.__Animals.stopSpeech();g.__Animals.dismissIntro();const id=select.value,el=[...g.document.querySelectorAll(`.animal[data-id="${id}"]`)].find(e=>e.tabIndex===0);if(!el)return;const img=el.querySelector('img');await img.decode();if(token!==serial)return;
 const box=el.getBoundingClientRect();g.__Animals.camera+=box.left+box.width/2-g.innerWidth*.56;
 const r=g.AnimalAnims.play(el,id);g.AnimalAnims.seek(el,0);await new Promise(requestAnimationFrame);g.AnimalAnims.seek(el,0);
 const start=performance.now(),duration=r.duration/Number(speed.value);function tick(t){if(token!==serial)return;const p=Math.min(1,(t-start)/duration);g.AnimalAnims.seek(el,p);if(p<1)raf=requestAnimationFrame(tick);else g.AnimalAnims.stop(el);}raf=requestAnimationFrame(tick);
}
frame.addEventListener('load',()=>{replay.disabled=false;play();});select.addEventListener('change',play);speed.addEventListener('change',play);replay.addEventListener('click',play);
</script></body></html>
