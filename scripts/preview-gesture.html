<!DOCTYPE html>
<meta charset="utf-8">
<canvas id="c" width="1480" height="860"></canvas>
<pre id="err"></pre>
<script src="../geo/assets/puppet-rigs.js"></script>
<script>
window.addEventListener('error', e => { document.getElementById('err').textContent = e.message; });
const c = document.getElementById('c'), ctx = c.getContext('2d');
ctx.fillStyle = '#efe4cf'; ctx.fillRect(0, 0, 1480, 860);
ctx.font = '18px sans-serif'; ctx.fillStyle = '#333';
function label(t, x, y) { ctx.fillStyle = '#333'; ctx.fillText(t, x, y); }
const cells = [];
function add(src, draw) { cells.push({src, draw}); }
add('../geo/assets/animation/v4-12-gait/zebra-sheet.webp', (img) => {
  label('zebra frame 0', 16, 22);
  ctx.drawImage(img, 0, 0, 900, 682, 16, 30, 300, 227);
  label('zebra frame 3', 340, 22);
  ctx.drawImage(img, 2700, 0, 900, 682, 340, 30, 300, 227);
});
add('../geo/assets/animation/v4-7/warthog-frames.webp', (img) => {
  const fw = img.naturalWidth / 4, fh = img.naturalHeight / 2;
  label('warthog frame 0', 680, 22);
  ctx.drawImage(img, 0, 0, fw, fh, 680, 30, 300, 300 * fh / fw);
  label('warthog frame 1', 1020, 22);
  ctx.drawImage(img, fw, 0, fw, fh, 1020, 30, 300, 300 * fh / fw);
});
add('../geo/assets/animation/v4-7/elephant-poster.webp', (img) => {
  const w = 340, h = w * img.naturalHeight / img.naturalWidth;
  label('elephant rest', 16, 300);
  ctx.save(); ctx.translate(16, 310); SpritePuppets.draw(ctx, 'elephant', img, 0.02, w, h); ctx.restore();
  label('elephant curl', 380, 300);
  ctx.save(); ctx.translate(380, 310); SpritePuppets.draw(ctx, 'elephant', img, 0.45, w, h); ctx.restore();
});
add('../geo/assets/animation/v4-1/hippo-poster.webp', (img) => {
  const w = 340, h = w * img.naturalHeight / img.naturalWidth;
  label('hippo rest', 760, 300);
  ctx.save(); ctx.translate(760, 310); SpritePuppets.draw(ctx, 'hippo', img, 0.02, w, h); ctx.restore();
  label('hippo open', 1120, 300);
  ctx.save(); ctx.translate(1120, 310); SpritePuppets.draw(ctx, 'hippo', img, 0.50, w, h); ctx.restore();
});
let n = cells.length;
for (const cell of cells) {
  const img = new Image();
  img.onload = () => { cell.draw(img); if (--n === 0) document.title = 'preview-ready'; };
  img.onerror = () => { document.getElementById('err').textContent += '\n' + cell.src; };
  img.src = cell.src;
}
</script>
